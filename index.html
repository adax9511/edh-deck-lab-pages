<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EDH Lab — Commander deck analyzer</title>
<meta name="description" content="Paste a Commander decklist and get mana curve, land math, infinite combos, bracket estimate, strengths, weaknesses and card suggestions.">
<meta name="theme-color" content="#030304">
<!-- Relative, not absolute: GitHub Pages serves this from a /repo-name/ subpath,
     where "/app.js" would resolve to the domain root and 404. -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ---- Design tokens -------------------------------------------------------
     "True Void" foundation with Bitcoin-orange and digital-gold energy.
     Variable NAMES are kept from the previous theme so every component picks the
     new palette up without a rewrite; only their VALUES changed. */
  :root{
    --bg:#030304;            /* True Void   */
    --bg2:#0F1115;           /* Dark Matter */
    --bg3:#161A21;           /* raised surface */
    --line:rgba(255,255,255,.10);
    --line-strong:#1E293B;

    --ink:#FFFFFF;           /* Pure Light  */
    --dim:#94A3B8;           /* Stardust    */
    --faint:#64748B;

    --accent:#F7931A;        /* Bitcoin Orange */
    --accent2:#FFD600;       /* Digital Gold   */
    --accent-deep:#EA580C;   /* Burnt Orange   */

    --good:#22C55E; --warn:#F7931A; --bad:#EF4444; --info:#38BDF8;

    --grad-fire:linear-gradient(to right,#EA580C,#F7931A);
    --grad-gold:linear-gradient(to right,#F7931A,#FFD600);

    /* Every shadow in this system is tinted, never pure black. */
    --glow-sm:0 0 20px -5px rgba(234,88,12,.5);
    --glow-md:0 0 30px -5px rgba(247,147,26,.6);
    --glow-card:0 0 30px -10px rgba(247,147,26,.2);
    --glow-gold:0 0 20px rgba(255,214,0,.3);

    --heading:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
    --sans:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    /* Kept for compatibility with existing references. */
    --serif:'Space Grotesk',ui-serif,Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
    overflow-x:hidden; position:relative;
  }
  h1,h2,h3,h4,h5,h6{font-family:var(--heading);letter-spacing:-.02em}

  /* ---- Textured void -------------------------------------------------------
     The background never sits flat: a blockchain-style grid that fades out at the
     edges, plus two soft radial energy fields. Both are inert and pointer-transparent. */
  body::before{
    content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
    background-size:50px 50px;
    background-image:
      linear-gradient(to right,rgba(30,41,59,.5) 1px,transparent 1px),
      linear-gradient(to bottom,rgba(30,41,59,.5) 1px,transparent 1px);
    -webkit-mask-image:radial-gradient(circle at 50% 0%,black 10%,transparent 75%);
    mask-image:radial-gradient(circle at 50% 0%,black 10%,transparent 75%);
  }
  body::after{
    content:'';position:fixed;top:-220px;left:50%;transform:translateX(-50%);
    width:900px;height:600px;z-index:0;pointer-events:none;
    background:radial-gradient(circle,rgba(247,147,26,.13),transparent 65%);
    filter:blur(120px);
  }
  #root{position:relative;z-index:1;min-height:100vh}

  button{font:inherit;color:inherit;cursor:pointer}
  textarea,input,select{font:inherit;color:inherit}
  a{color:var(--accent)}
  ::selection{background:var(--accent);color:#1a1200}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:5px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(247,147,26,.45)}

  /* Focus is always visible, in the accent colour. */
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

  /* Gradient text for the headline's final words. */
  .grad-text{
    background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;
    color:transparent;
  }

  /* ---- Report layout -------------------------------------------------------
     The decklist stays pinned while the analysis scrolls beside it. Inline styles
     can't express media queries, so the responsive rules live here. */
  .layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:26px;align-items:start}
  .sidebar{position:sticky;top:76px;max-height:calc(100vh - 96px);
           display:flex;flex-direction:column;gap:12px}
  .decklist{display:flex;flex-direction:column;flex:1;min-height:0}
  .decklist-scroll{overflow-y:auto;flex:1;min-height:0}
  @media (max-width:1000px){
    .layout{grid-template-columns:1fr;gap:20px}
    /* Unpin: a sticky column taller than the viewport just clips itself.
       The jump links stay — they matter more here, since the report is one
       long single column and they let you skip past the decklist. */
    .sidebar{position:static;max-height:none}
    .decklist{flex:none}
    .decklist-scroll{flex:none;max-height:56vh}
  }
  html{scroll-behavior:smooth}
  .anchor{scroll-margin-top:86px}

  /* Rows in the decklist reveal their controls on hover, so the list stays calm
     until you actually want to edit it. */
  .deck-row .row-controls{opacity:0;transition:opacity .12s}
  .deck-row:hover .row-controls,
  .deck-row:focus-within .row-controls{opacity:1}
  @media (hover:none){ .deck-row .row-controls{opacity:1} }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
      transition-duration:.001ms!important;scroll-behavior:auto!important}
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="./app.js?v=0f1c24e33b"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      // Register relative to this page so the worker scopes to the subpath too.
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    });
  }
</script>
</body>
</html>
